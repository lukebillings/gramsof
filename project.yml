name: ProteinTracker
options:
  bundleIdPrefix: com.lukebillings
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupOrdering:
    - order: [ProteinTracker]

settings:
  base:
    DEVELOPMENT_TEAM: 66VA8628J7

schemes:
  ProteinTracker:
    build:
      targets:
        ProteinTracker: all
    run:
      config: Debug
      storeKitConfiguration: Products.storekit
    archive:
      config: Release

targets:
  ProteinTracker:
    type: application
    platform: iOS
    sources:
      - path: ProteinTracker
    entitlements:
      path: ProteinTracker/ProteinTracker.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.$(CFBundleIdentifier)
        com.apple.developer.icloud-services:
          - CloudKit
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.$(CFBundleIdentifier)
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukebillings.ProteinTracker
        PRODUCT_NAME: Protein Tracker
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Gramsof
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        SWIFT_VERSION: 5.0
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG
